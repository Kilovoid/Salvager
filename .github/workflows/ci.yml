name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Salvager.slnx

      - name: Build
        run: dotnet build Salvager.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Tests/Tests.csproj --configuration Release --no-build --verbosity normal
